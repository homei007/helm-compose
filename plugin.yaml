apiVersion: v1
type: cli/v1
name: compose
version: 1.4.0
runtime: subprocess
sourceURL: https://github.com/homei007/helm-compose

config:
  usage: Compose is a helm plugin to define and manage multiple helm releases as single entity.

runtimeConfig:
  platformCommand:
    - command: ${HELM_PLUGIN_DIR}/bin/compose
    - os: windows
      command: ${HELM_PLUGIN_DIR}\\bin\\compose.exe
  platformHooks:
    install:
      - command: ${HELM_PLUGIN_DIR}/scripts/install.sh
    update:
      - command: ${HELM_PLUGIN_DIR}/scripts/install.sh
        args:
          - -u

# Legacy fields are retained for Helm 3 compatibility.
usage: Compose is a helm plugin to define and manage multiple helm releases as single entity.
command: $HELM_PLUGIN_DIR/bin/compose
hooks:
  install: $HELM_PLUGIN_DIR/scripts/install.sh
  update: $HELM_PLUGIN_DIR/scripts/install.sh
